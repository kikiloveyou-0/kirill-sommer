<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo · kirill</title>
<link rel="stylesheet" href="style.css?v=4">
<style>
.photos figure { cursor: pointer; }
body.lb-open { overflow: hidden; }
#lb { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483647; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; }
#lb[hidden] { display: none !important; }
#lb .win { position: relative; background: #000; border: 1px solid #fff; color: #fff; width: 92vw; height: 90vh; display: flex; flex-direction: column; }
#lb .bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #fff; padding: 0 12px; height: 40px; flex: none; font-size: 13px; }
#lb .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 56px; }
#lb img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
#lb button { background: none; border: 0; color: #fff; font: inherit; cursor: pointer; padding: 8px; font-size: 13px; }
#lb .nav { position: absolute; top: 0; bottom: 0; width: 52px; font-size: 22px; }
#lb-prev { left: 0; } #lb-next { right: 0; }
</style>
</head>
<body>

<header class="top">
  <a href="index.html">kirill</a>
  <a href="motion-picture.html">motion picture</a>
  <a href="photo.html" aria-current="page">photo</a>
  <a href="about.html">about</a>
  <a href="contact.html">contact</a>
</header>

<main>
  <div class="photos">
    <figure><img src="photos/film-2ef7c836.jpg" alt="" loading="lazy"><figcaption>medium format film</figcaption></figure>
    <figure><img src="photos/film-3e7e4dc3.jpg" alt="" loading="lazy"><figcaption>medium format film</figcaption></figure>
    <figure><img src="photos/film-ff08e0b7.jpg" alt="" loading="lazy"><figcaption>medium format film</figcaption></figure>
    <figure><img src="photos/film-456c7568.jpg" alt="" loading="lazy"><figcaption>medium format film</figcaption></figure>
    <figure><img src="photos/iphone-2026-04-22.jpg" alt="" loading="lazy"><figcaption>2026 · iphone</figcaption></figure>
    <figure><img src="photos/iphone-2026-05-30a.jpg" alt="" loading="lazy"><figcaption>2026 · iphone</figcaption></figure>
    <figure><img src="photos/iphone-2026-05-30b.jpg" alt="" loading="lazy"><figcaption>2026 · iphone</figcaption></figure>
    <figure><img src="photos/iphone-2026-07-15.jpg" alt="" loading="lazy"><figcaption>2026 · iphone</figcaption></figure>
    <figure><img src="photos/iphone-2026-08-23.jpg" alt="" loading="lazy"><figcaption>2026 · iphone</figcaption></figure>
    <figure><img src="photos/iphone-2026-08-31.jpg" alt="" loading="lazy"><figcaption>2026 · iphone</figcaption></figure>
    <figure><img src="photos/iphone-2026-09-16.jpg" alt="" loading="lazy"><figcaption>2026 · iphone</figcaption></figure>
  </div>
</main>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="photo viewer">
  <div class="win">
    <div class="bar"><span id="lb-cap"></span><span><span id="lb-count"></span> <button id="lb-close" type="button" aria-label="close">close</button></span></div>
    <div class="stage">
      <button class="nav" id="lb-prev" type="button" aria-label="previous">&#8592;</button>
      <img id="lb-img" alt="">
      <button class="nav" id="lb-next" type="button" aria-label="next">&#8594;</button>
    </div>
  </div>
</div>
<script>
(function () {
  var figs = Array.prototype.slice.call(document.querySelectorAll('.photos figure'));
  var lb = document.getElementById('lb'), img = document.getElementById('lb-img'), cap = document.getElementById('lb-cap');
  var i = 0;
  function show(n) {
    i = (n + figs.length) % figs.length;
    img.src = figs[i].querySelector('img').getAttribute('src');
    cap.textContent = figs[i].querySelector('figcaption').textContent;
    document.getElementById('lb-count').textContent = (i + 1) + ' / ' + figs.length;
  }
  function open(n) { show(n); lb.hidden = false; document.body.classList.add('lb-open'); }
  function close() { lb.hidden = true; document.body.classList.remove('lb-open'); }
  figs.forEach(function (f, n) { f.addEventListener('click', function () { open(n); }); });
  document.getElementById('lb-prev').onclick = function (e) { e.stopPropagation(); show(i - 1); };
  document.getElementById('lb-next').onclick = function (e) { e.stopPropagation(); show(i + 1); };
  document.getElementById('lb-close').onclick = close;
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(i - 1);
    else if (e.key === 'ArrowRight') show(i + 1);
  });
  var x0 = null;
  lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var d = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(d) > 40) show(i + (d < 0 ? 1 : -1));
  });
})();
</script>

</body>
</html>
